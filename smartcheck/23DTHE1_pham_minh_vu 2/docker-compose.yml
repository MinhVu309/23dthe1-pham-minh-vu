# SQL Server cho máy dev. KHÔNG dùng khi deploy (bản deploy trỏ tới SQL Server trên mạng).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64   # Apple Silicon: bật "Use Rosetta" trong Docker Desktop
    container_name: smartcheck-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SmartCheck@123"
    ports:
      - "1433:1433"
    volumes:
      - smartcheck-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  smartcheck-sql-data:
